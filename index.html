<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b1d14">
<title>팬케이크 플립</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #2b1d14; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* 노치·홈 인디케이터를 피하도록 안전 영역만큼 여백 */
  html {
    box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  canvas { display: block; touch-action: none; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const TAP = IS_TOUCH ? '화면을 탭' : '스페이스바 또는 클릭';

// ---------- 화면 맞춤 / 레이아웃 ----------
// 가로 화면: 800x600 그대로. 세로 화면(휴대폰): 540x860 캔버스에 주방을 축소해서 위에, 접시·게이지를 아래에 배치.
// 게임 오브젝트는 모두 '월드 좌표'(원래 800x600 기준)로 그리고, WORLD 변환으로 화면에 맞춘다.
let W = 800, H = 600, PORTRAIT = false;
let WORLD = { s: 1, tx: 0, ty: 0 };
let PLATE = { x: 640, y: 480 };
let GAUGE = { x: 60, y: 110, h: 300, w: 40 };
let STACK_MAX = 22, F = 1;   // F: 작은 글씨 확대 배율
function fit() {
  // 안전 영역 여백을 뺀 실제 표시 영역 기준
  const vw = document.body.clientWidth || window.innerWidth;
  const vh = document.body.clientHeight || window.innerHeight;
  PORTRAIT = vh > vw * 1.1;
  if (PORTRAIT) {
    W = 540; H = 860;
    WORLD = { s: 0.8, tx: -70, ty: 40 };
    PLATE = { x: 440, y: 760 };
    GAUGE = { x: 115, y: 490, h: 310, w: 56 };
    STACK_MAX = 18; F = 1.4;
  } else {
    W = 800; H = 600;
    WORLD = { s: 1, tx: 0, ty: 0 };
    PLATE = { x: 640, y: 480 };
    GAUGE = { x: 60, y: 110, h: 300, w: 40 };
    STACK_MAX = 22; F = IS_TOUCH ? 1.25 : 1;
  }
  const s = Math.min(vw / W, vh / H) * 0.98;
  const cssW = W * s, cssH = H * s;
  cv.style.width = cssW + 'px';
  cv.style.height = cssH + 'px';
  // 고해상도 화면(레티나 등)에서 선명하게
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 200));
fit();

// ---------- 사운드 (WebAudio) ----------
let ac = null, sizzleGain = null;
function initAudio() {
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    // 지글지글 소리: 노이즈 루프
    const len = ac.sampleRate * 2;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.02 ? 1 : 0.25);
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
    sizzleGain = ac.createGain(); sizzleGain.gain.value = 0;
    src.connect(hp); hp.connect(sizzleGain); sizzleGain.connect(ac.destination);
    src.start();
  } catch (e) { ac = null; }
}
function tone(freq, dur, type = 'sine', vol = 0.2, slide = 0) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, ac.currentTime + dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function setSizzle(v) { if (sizzleGain) sizzleGain.gain.setTargetAtTime(v, ac.currentTime, 0.1); }
const sfx = {
  flip: () => tone(300, 0.15, 'triangle', 0.25, 2.2),
  perfect: () => { tone(880, 0.12, 'square', 0.12); setTimeout(() => tone(1320, 0.2, 'square', 0.12), 80); },
  good: () => tone(660, 0.15, 'triangle', 0.18),
  bad: () => tone(160, 0.3, 'sawtooth', 0.15, 0.6),
  serve: () => { tone(523, 0.1, 'triangle', 0.18); setTimeout(() => tone(784, 0.18, 'triangle', 0.18), 90); },
  tick: () => tone(1000, 0.05, 'square', 0.08),
  end: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.25, 'triangle', 0.2), i * 120)); },
};

// ---------- 판정 규칙 ----------
// doneness(익힘 정도) 0 = 반죽, 1 = 많이 탐. 목표 구간 중심에서 얼마나 가까운지로 판정
const JUDGE = [
  { name: 'PERFECT!', range: 0.035, pts: 100, color: '#ffd84a', combo: true },
  { name: 'GREAT',    range: 0.08,  pts: 70,  color: '#7cf07c', combo: true },
  { name: 'GOOD',     range: 0.14,  pts: 40,  color: '#7cc8ff', combo: false },
];
const BURN_LIMIT = 1.12;      // 이 이상이면 자동으로 탄 것으로 처리
const GAME_TIME = 30;

function judge(p, target) {
  const diff = Math.abs(p - target);
  for (const j of JUDGE) if (diff <= j.range) return j;
  return p < target
    ? { name: '덜 익음', pts: 10, color: '#f0e0b0', combo: false, miss: true }
    : { name: '탔어요…', pts: 0, color: '#ff6a4a', combo: false, miss: true };
}

// 익힘 정도에 따른 색
const STOPS = [
  [0.00, [246, 230, 186]],
  [0.45, [240, 205, 130]],
  [0.72, [214, 146, 62]],
  [0.88, [160, 92, 38]],
  [1.05, [70, 40, 22]],
  [1.20, [35, 22, 15]],
];
function cookColor(d, shade = 0) {
  d = Math.max(0, Math.min(1.2, d));
  let i = 0;
  while (i < STOPS.length - 2 && d > STOPS[i + 1][0]) i++;
  const [a, ca] = STOPS[i], [b, cb] = STOPS[i + 1];
  const t = Math.max(0, Math.min(1, (d - a) / (b - a)));
  const c = ca.map((v, k) => Math.round((v + (cb[k] - v) * t) * (1 - shade)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

// ---------- 게임 상태 ----------
let state = 'title';   // title | countdown | play | end
let timeLeft = GAME_TIME, countdown = 0;
let score = 0, combo = 0, maxCombo = 0, made = 0, perfects = 0;
let pc = null;          // 현재 팬케이크
let stack = [];         // 완성된 팬케이크 (접시)
let popups = [], particles = [];
let best = 0;
try { best = +localStorage.getItem('pancake_best') || 0; } catch (e) {}
let lastTick = -1, shake = 0, speedLevel = 0;

// 경과 시간에 따른 속도 배율: 시작 x1.0 → 30초 x2.0 (후반으로 갈수록 더 가파르게 증가)
const BASE_SPEED = 0.5, MAX_MULT = 2.0;
function speedMult() {
  const k = Math.min(1, Math.max(0, (GAME_TIME - timeLeft) / GAME_TIME));
  return 1 + (MAX_MULT - 1) * Math.pow(k, 1.3);
}

function newPancake() {
  pc = {
    phase: 'pour', t: 0,
    side: 0,                    // 0: 첫 번째 면, 1: 두 번째 면
    p: 0,                       // 현재 아래쪽 면의 익힘
    sideA: 0, sideB: 0,         // 각 면의 최종 익힘
    rand: 0.9 + Math.random() * 0.2,   // 팬케이크마다 약간의 속도 편차
    target: 0.68 + Math.random() * 0.1,
    results: [],
    flipT: 0,
  };
}

function resetGame() {
  timeLeft = GAME_TIME; score = 0; combo = 0; maxCombo = 0; made = 0; perfects = 0;
  stack = []; popups = []; particles = []; lastTick = -1; speedLevel = 0;
  newPancake();
}

function addPopup(text, color, size = 40, y = 250) {
  popups.push({ text, color, size, x: 400, y, t: 0 });
}

function doFlip(auto = false) {
  if (!pc || pc.phase !== 'cook') return;
  const j = auto ? judge(BURN_LIMIT, pc.target) : judge(pc.p, pc.target);
  if (j.combo) { combo++; maxCombo = Math.max(maxCombo, combo); } else combo = 0;
  if (j.name === 'PERFECT!') perfects++;
  const mult = 1 + Math.min(combo, 10) * 0.1;
  const gained = Math.round(j.pts * mult);
  score += gained;
  pc.results.push(j);
  addPopup(j.name, j.color, j.name === 'PERFECT!' ? 54 : 42);
  if (gained > 0) addPopup('+' + gained + (combo > 1 ? `  (콤보 x${combo})` : ''), '#fff', 22, 300);
  if (j.name === 'PERFECT!') { sfx.perfect(); burst(400, 330, '#ffd84a', 24); }
  else if (j.miss) { sfx.bad(); shake = 0.3; if (j.pts === 0) smoke(400, 330, 18); }
  else sfx.good();
  sfx.flip();

  if (pc.side === 0) pc.sideA = pc.p; else pc.sideB = pc.p;
  pc.phase = pc.side === 0 ? 'flip' : 'serve';
  pc.flipT = 0;
}

function finishPancake() {
  const r = pc.results;
  made++;
  let bonus = 0;
  if (r.every(x => x.name === 'PERFECT!')) bonus = 100;
  else if (r.every(x => !x.miss)) bonus = 30;
  if (bonus) {
    score += bonus;
    addPopup(bonus === 100 ? `완벽한 팬케이크! +${bonus}` : `완성! +${bonus}`, '#ffb347', 26, 200);
  }
  const quality = r.reduce((s, x) => s + x.pts, 0);
  stack.push({ a: pc.sideA, b: pc.sideB, quality, wob: (Math.random() - 0.5) * 8 });
  sfx.serve();
  burst(PLATE.x, PLATE.y - 10 - Math.min(stack.length, STACK_MAX) * 12, '#fff3c0', 10);
  newPancake();
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 100, life: 0.7, max: 0.7, color, r: 3 + Math.random() * 3, g: 400 });
  }
}
function smoke(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x: x + (Math.random() - 0.5) * 120, y, vx: (Math.random() - 0.5) * 30, vy: -60 - Math.random() * 60, life: 1.4, max: 1.4, color: 'rgba(60,60,60,', r: 10 + Math.random() * 14, g: -10, smoke: true });
  }
}

// ---------- 입력 ----------
function unlockAudio() {
  initAudio();
  if (ac && ac.state !== 'running') { try { ac.resume(); } catch (e) {} }
}
function press() {
  unlockAudio();
  if (state === 'title' || (state === 'end' && endT > 1.0)) {
    resetGame(); state = 'countdown'; countdown = 3; lastTick = 4;
    return;
  }
  if (state === 'play') doFlip(false);
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(); }
});
// 터치는 손가락이 닿는 순간(touchstart) 바로 반응해야 타이밍이 정확하다
if (window.PointerEvent) {
  window.addEventListener('pointerdown', e => { e.preventDefault(); press(); }, { passive: false });
} else {
  window.addEventListener('touchstart', e => { e.preventDefault(); press(); }, { passive: false });
  window.addEventListener('mousedown', e => { e.preventDefault(); press(); });
}
// iOS Safari는 touchend에서만 오디오가 풀리는 경우가 있어 한 번 더 시도
window.addEventListener('touchend', e => { e.preventDefault(); unlockAudio(); }, { passive: false });
// 길게 누르기 메뉴, 더블탭 확대, 핀치 확대 방지
window.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// ---------- 업데이트 ----------
let endT = 0;
function update(dt) {
  shake = Math.max(0, shake - dt);

  if (state === 'countdown') {
    countdown -= dt;
    const c = Math.ceil(countdown);
    if (c !== lastTick && c > 0) { lastTick = c; sfx.tick(); }
    if (countdown <= 0) { state = 'play'; tone(1200, 0.2, 'square', 0.12); }
  }

  if (state === 'play') {
    timeLeft -= dt;
    const sec = Math.ceil(timeLeft);
    if (sec <= 5 && sec !== lastTick && sec > 0) { lastTick = sec; sfx.tick(); }
    const lv = Math.floor((GAME_TIME - timeLeft) / 10);
    if (lv > speedLevel && lv < 3) {
      speedLevel = lv;
      addPopup(`속도 UP!  x${speedMult().toFixed(1)}`, '#ff7a4a', 34, 150);
      tone(500, 0.25, 'sawtooth', 0.12, 2);
    }
    if (timeLeft <= 0) {
      timeLeft = 0; state = 'end'; endT = 0; setSizzle(0); sfx.end();
      if (score > best) { best = score; try { localStorage.setItem('pancake_best', best); } catch (e) {} newRecord = true; }
      else newRecord = false;
    }
  }

  if (state === 'play' && pc) {
    pc.t += dt;
    if (pc.phase === 'pour') {
      if (pc.t > 0.35) { pc.phase = 'cook'; pc.t = 0; }
    } else if (pc.phase === 'cook') {
      // 익을수록 조금씩 빨라짐
      pc.p += BASE_SPEED * speedMult() * pc.rand * (0.75 + pc.p * 0.5) * dt;
      setSizzle(0.04 + pc.p * 0.06);
      if (pc.p > 0.95 && Math.random() < dt * 8) smoke(400, 330, 1);
      if (pc.p >= BURN_LIMIT) doFlip(true);
    } else if (pc.phase === 'flip') {
      pc.flipT += dt / 0.45;
      setSizzle(0.02);
      if (pc.flipT >= 1) { pc.phase = 'cook'; pc.side = 1; pc.p = 0; pc.target = 0.68 + Math.random() * 0.1; }
    } else if (pc.phase === 'serve') {
      pc.flipT += dt / 0.45;
      setSizzle(0.01);
      if (pc.flipT >= 1) finishPancake();
    }
  } else if (state !== 'play') setSizzle(0);

  if (state === 'end') endT += dt;

  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < 1.0);
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
  particles = particles.filter(p => p.life > 0);
}
let newRecord = false;

// ---------- 그리기 ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawBackground() {
  // 벽 타일
  // 월드 좌표로 그리므로 세로 화면에서도 빈틈이 없도록 넉넉하게 칠한다
  const L = -300, R = 1100, T = -300, B = 1300;
  ctx.fillStyle = '#f4ead8'; ctx.fillRect(L, T, R - L, 380 - T);
  ctx.strokeStyle = '#e3d5bc'; ctx.lineWidth = 2;
  for (let x = L; x <= R; x += 50) { ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, 380); ctx.stroke(); }
  for (let y = T; y <= 380; y += 50) { ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke(); }
  // 조리대
  const g = ctx.createLinearGradient(0, 380, 0, PORTRAIT ? 1050 : 600);
  g.addColorStop(0, '#8a5a3b'); g.addColorStop(1, '#5d3a24');
  ctx.fillStyle = g; ctx.fillRect(L, 380, R - L, B - 380);
  ctx.fillStyle = '#a06c48'; ctx.fillRect(L, 380, R - L, 10);
}

function drawStove() {
  // 화구
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.ellipse(400, 420, 190, 50, 0, 0, Math.PI * 2); ctx.fill();
  const flame = state === 'play' ? 1 : 0.4;
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    const fx = 400 + Math.cos(a) * 120, fy = 420 + Math.sin(a) * 30;
    const h = (10 + Math.random() * 8) * flame;
    ctx.fillStyle = `rgba(80,140,255,${0.7 * flame})`;
    ctx.beginPath(); ctx.ellipse(fx, fy - h / 2, 5, h, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function drawPan() {
  // 손잡이
  ctx.fillStyle = '#2a2a2a';
  roundRect(560, 365, 200, 26, 12); ctx.fill();
  ctx.fillStyle = '#6b3f22'; roundRect(640, 368, 115, 20, 10); ctx.fill();
  // 팬 본체
  ctx.fillStyle = '#1e1e1e'; ctx.beginPath(); ctx.ellipse(400, 385, 185, 62, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3a3a3a'; ctx.beginPath(); ctx.ellipse(400, 375, 175, 55, 0, 0, Math.PI * 2); ctx.fill();
  const g = ctx.createRadialGradient(370, 360, 10, 400, 375, 170);
  g.addColorStop(0, '#555'); g.addColorStop(1, '#262626');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(400, 378, 160, 48, 0, 0, Math.PI * 2); ctx.fill();
}

// 팬케이크 한 장 그리기. top: 윗면 익힘, bottom: 아랫면 익힘(옆면 색), sy: 세로 스케일(뒤집기용)
function drawPancake(x, y, rx, ry, top, bottom, sy = 1, rot = 0, raw = false) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, sy);
  const thick = 12;
  // 옆면(두께)
  ctx.fillStyle = cookColor(bottom, 0.15);
  ctx.beginPath(); ctx.ellipse(0, thick / 2, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(-rx, 0, rx * 2, thick / 2);
  // 윗면
  const g = ctx.createRadialGradient(-rx * 0.2, -ry * 0.3, 5, 0, 0, rx);
  g.addColorStop(0, cookColor(top * 0.85));
  g.addColorStop(0.7, cookColor(top));
  g.addColorStop(1, cookColor(top + 0.12));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  // 반죽 윗면의 기포
  if (raw) {
    ctx.fillStyle = 'rgba(200,170,110,0.6)';
    const n = Math.floor(Math.min(1, pc ? pc.p * 1.4 : 0) * 14);
    for (let i = 0; i < n; i++) {
      const a = i * 2.39, r = (0.25 + (i * 0.37) % 0.6) * rx;
      ctx.beginPath(); ctx.ellipse(Math.cos(a) * r, Math.sin(a) * r * ry / rx, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawCurrentPancake() {
  if (!pc || state === 'title') return;
  const baseY = 368;
  if (pc.phase === 'pour') {
    const k = Math.max(0.01, Math.min(1, pc.t / 0.35));
    // 반죽 줄기
    ctx.fillStyle = cookColor(0);
    ctx.fillRect(395, 120, 10 * (1 - k * 0.5), baseY - 120);
    drawPancake(400, baseY, 125 * k, 38 * k, 0, 0, 1, 0, false);
  } else if (pc.phase === 'cook') {
    // 위는 아직 덜 익은 면 (두 번째 면일 땐 이미 익힌 sideA가 위)
    const top = pc.side === 0 ? Math.min(pc.p * 0.25, 0.3) : pc.sideA;
    drawPancake(400, baseY, 125, 38, top, pc.p, 1, 0, pc.side === 0);
    // 김
    if (Math.random() < 0.3) particles.push({ x: 300 + Math.random() * 200, y: 350, vx: 0, vy: -40, life: 1, max: 1, color: 'rgba(255,255,255,', r: 6 + Math.random() * 6, g: -20, smoke: true });
  } else {
    const t = Math.min(1, pc.flipT);
    if (pc.phase === 'flip') {
      // 공중으로 튀어올라 한 바퀴 회전
      const h = Math.sin(t * Math.PI) * 170;
      const ang = t * Math.PI;
      const sy = Math.cos(ang);
      const showingBottom = sy < 0;
      const top = showingBottom ? pc.sideA : Math.min(pc.sideA * 0.25, 0.3);
      drawPancake(400, baseY - h, 125, 38, top, pc.sideA, Math.max(0.08, Math.abs(sy)), 0, false);
    } else {
      // 접시로 날아감
      const sx = 400 + (PLATE.x - 400) * t;
      const ty = PLATE.y - 10 - (Math.min(stack.length, STACK_MAX - 1) + 1) * 12;
      const sy0 = baseY + (ty - baseY) * t - Math.sin(t * Math.PI) * 200;
      const ang = t * Math.PI;
      const s = 1 - t * 0.28;
      const showingB = Math.cos(ang) < 0;
      drawPancake(sx, sy0, 125 * s, 38 * s, showingB ? pc.sideB : pc.sideA, pc.sideB, Math.max(0.08, Math.abs(Math.cos(ang))), 0, false);
    }
  }
}

function drawPlate() {
  // 접시
  const px = PLATE.x, py = PLATE.y;
  ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.ellipse(px, py + 5, 115, 30, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(px, py, 110, 27, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#cfd8e3'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(px, py, 80, 18, 0, 0, Math.PI * 2); ctx.stroke();
  // 쌓인 팬케이크 (화면에 다 안 들어가면 위쪽 일부만)
  const visible = stack.slice(-STACK_MAX);
  visible.forEach((p, i) => drawPancake(px + p.wob, py - 10 - (i + 1) * 12, 90, 24, p.b, p.a, 1));
  if (stack.length) {
    const topY = py - 10 - visible.length * 12;
    // 버터
    ctx.fillStyle = '#ffe680'; roundRect(px - 15, topY - 16, 30, 14, 3); ctx.fill();
    ctx.fillStyle = '#fff4b0'; roundRect(px - 15, topY - 16, 30, 5, 2); ctx.fill();
  }
  ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(22 * F)}px sans-serif`; ctx.textAlign = 'center';
  ctx.fillText(`${made}개 완성`, px, py + 70);
}

function drawGauge() {
  if (!pc || state !== 'play') return;
  const x = GAUGE.x, y = GAUGE.y, w = GAUGE.w, h = GAUGE.h;
  // 판넬
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; roundRect(x - 14, y - 50, w + 28, h + 82, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(15 * F)}px sans-serif`; ctx.textAlign = 'center';
  ctx.fillText(pc.side === 0 ? '앞면' : '뒷면', x + w / 2, y - 26);
  // 그라데이션 (아래 = 반죽, 위 = 탐)
  const MAX = 1.2;
  const yOf = v => y + h - (v / MAX) * h;
  const g = ctx.createLinearGradient(0, y + h, 0, y);
  for (const [s, c] of STOPS) g.addColorStop(Math.min(1, s / MAX), `rgb(${c})`);
  ctx.fillStyle = g; roundRect(x, y, w, h, 6); ctx.fill();
  // 판정 구간
  const t = pc.target;
  const zones = [[JUDGE[2].range, 'rgba(124,200,255,0.35)'], [JUDGE[1].range, 'rgba(124,240,124,0.55)'], [JUDGE[0].range, 'rgba(255,216,74,0.9)']];
  for (const [r, c] of zones) { ctx.fillStyle = c; ctx.fillRect(x - 6, yOf(t + r), w + 12, yOf(t - r) - yOf(t + r)); }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; roundRect(x, y, w, h, 6); ctx.stroke();
  // 현재 위치 화살표
  const cur = pc.phase === 'cook' ? pc.p : (pc.side === 0 ? pc.sideA : pc.sideB);
  const cy = Math.max(y, yOf(cur));
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(x + w + 8, cy); ctx.lineTo(x + w + 22, cy - 9); ctx.lineTo(x + w + 22, cy + 9); ctx.closePath(); ctx.fill();
  ctx.fillRect(x - 4, cy - 2, w + 8, 4);
  ctx.font = `${Math.round(12 * F)}px sans-serif`; ctx.fillStyle = '#ccc';
  ctx.fillText('반죽', x + w / 2, y + h + 20);
  ctx.fillText('탐', x + w / 2, y - 4);
}

function drawHUD() {
  // 상단 바
  ctx.fillStyle = 'rgba(60,35,20,0.85)'; ctx.fillRect(0, 0, W, 56);
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 26px sans-serif';
  ctx.fillText(`점수 ${score}`, 20, 38);
  ctx.textAlign = 'right'; ctx.font = '18px sans-serif'; ctx.fillStyle = '#e8cfa8';
  ctx.fillText(`최고 ${best}`, W - 20, 36);
  // 시간 바
  const tw = PORTRAIT ? 190 : 300, tx = W / 2 - tw / 2;
  ctx.fillStyle = '#3a2416'; roundRect(tx, 18, tw, 22, 11); ctx.fill();
  const r = timeLeft / GAME_TIME;
  ctx.fillStyle = timeLeft <= 5 ? (Math.floor(timeLeft * 4) % 2 ? '#ff5a3a' : '#ff9a3a') : '#ffb347';
  roundRect(tx, 18, Math.max(22, tw * r), 22, 11); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 16px sans-serif';
  ctx.fillText(`${Math.ceil(timeLeft)}초`, W / 2, 35);
  // 콤보
  if (combo >= 2 && state === 'play') {
    ctx.fillStyle = '#ffd84a'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(`${combo} COMBO  x${(1 + Math.min(combo, 10) * 0.1).toFixed(1)}`, W - 20, 90);
  }
  if (state === 'play') {
    const m = speedMult();
    ctx.textAlign = 'center'; ctx.font = 'bold 18px sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,20,10,0.8)';
    ctx.strokeText(`속도 x${m.toFixed(1)}`, W / 2, 82);
    ctx.fillStyle = m < 1.35 ? '#fff' : m < 1.7 ? '#ffb347' : '#ff5a3a';
    ctx.fillText(`속도 x${m.toFixed(1)}`, W / 2, 82);
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = `${PORTRAIT ? 18 : 15}px sans-serif`; ctx.textAlign = 'center';
    ctx.fillText(IS_TOUCH ? '화면 아무 곳이나 탭 : 뒤집기  —  노란 구간에서!'
                          : '스페이스바 / 클릭 : 뒤집기   —   게이지가 노란 구간에 올 때!', W / 2, H - 12);
  }
}

function drawFX() {
  for (const p of particles) {
    const a = p.life / p.max;
    if (p.smoke) { ctx.fillStyle = p.color + (0.35 * a) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (2 - a), 0, Math.PI * 2); ctx.fill(); }
    else { ctx.globalAlpha = a; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  }
  ctx.textAlign = 'center';
  for (const p of popups) {
    const k = p.t;
    const sc = k < 0.12 ? 0.6 + k / 0.12 * 0.5 : 1.1 - Math.min(0.1, (k - 0.12));
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, k - 0.6) / 0.4);
    ctx.translate(p.x, p.y - k * 50); ctx.scale(sc, sc);
    ctx.font = `900 ${p.size}px sans-serif`;
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(40,20,10,0.9)'; ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
}

function overlay(alpha = 0.6) { ctx.fillStyle = `rgba(30,18,10,${alpha})`; ctx.fillRect(0, 0, W, H); }
function bigText(t, y, size, color = '#fff') {
  ctx.textAlign = 'center'; ctx.font = `900 ${size}px sans-serif`;
  ctx.lineWidth = 8; ctx.strokeStyle = '#3a2416'; ctx.strokeText(t, W / 2, y);
  ctx.fillStyle = color; ctx.fillText(t, W / 2, y);
}

function drawTitle() {
  overlay(0.6);
  const oy = (H - 600) / 2;
  bigText('팬케이크 플립', 140 + oy, PORTRAIT ? 64 : 72, '#ffcc66');
  ctx.fillStyle = '#fff'; ctx.font = `${PORTRAIT ? 19 : 20}px sans-serif`; ctx.textAlign = 'center';
  const lines = [
    '30초 안에 팬케이크를 최대한 많이, 잘 구우세요!',
    '노란 구간에서 뒤집기 → 한 번 더 뒤집으면 완성',
    '',
    'PERFECT 100 · GREAT 70 · GOOD 40',
    '덜 익음 10 · 탐 0',
    'GREAT 이상 연속 성공 시 콤보 배율 (최대 x2.0)',
    '양면 모두 PERFECT면 보너스 +100',
    '시간이 지날수록 빨리 익습니다 (30초에 x2.0)',
  ];
  const lh = PORTRAIT ? 34 : 30;
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 200 + oy + i * lh));
  const by = 200 + oy + lines.length * lh + 30;
  if (Math.floor(performance.now() / 500) % 2) bigText(`${TAP}해서 시작`, by, 30);
  if (best) { ctx.fillStyle = '#e8cfa8'; ctx.font = '18px sans-serif'; ctx.fillText(`최고 기록 ${best}점`, W / 2, by + 45); }
}

function grade() {
  if (score >= 2200) return ['S', '#ffd84a', '전설의 팬케이크 장인'];
  if (score >= 1600) return ['A', '#7cf07c', '브런치 카페 셰프'];
  if (score >= 1000) return ['B', '#7cc8ff', '주말의 아빠 요리사'];
  if (score >= 500)  return ['C', '#f0e0b0', '팬케이크 견습생'];
  return ['D', '#ff8a6a', '프라이팬이 무서워요'];
}

function drawEnd() {
  overlay(Math.min(0.7, endT * 1.5));
  if (endT < 0.3) return;
  const oy = (H - 600) / 2;
  bigText('시간 종료!', 120 + oy, 60, '#ffcc66');
  const [g, gc, title] = grade();
  bigText(g, 230 + oy, 110, gc);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(title, W / 2, 275 + oy);
  ctx.font = 'bold 34px sans-serif'; ctx.fillStyle = '#ffd84a';
  ctx.fillText(`${score}점`, W / 2, 330 + oy);
  ctx.font = '20px sans-serif'; ctx.fillStyle = '#fff';
  if (PORTRAIT) {
    ctx.fillText(`완성 ${made}개  ·  PERFECT ${perfects}회`, W / 2, 370 + oy);
    ctx.fillText(`최대 콤보 ${maxCombo}`, W / 2, 398 + oy);
  } else {
    ctx.fillText(`완성 ${made}개  ·  PERFECT ${perfects}회  ·  최대 콤보 ${maxCombo}`, W / 2, 370 + oy);
  }
  const ry = PORTRAIT ? 450 : 420;
  if (newRecord) bigText('신기록!', ry + oy, 36, '#ff7ab0');
  else { ctx.fillStyle = '#e8cfa8'; ctx.fillText(`최고 기록 ${best}점`, W / 2, ry - 5 + oy); }
  if (endT > 1.0 && Math.floor(performance.now() / 500) % 2) bigText(`${TAP}해서 다시 하기`, 520 + oy, 28);
}

function draw() {
  // 논리 좌표(W x H) → 실제 캔버스 픽셀
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 12 * shake, (Math.random() - 0.5) * 12 * shake);
  ctx.translate(WORLD.tx, WORLD.ty); ctx.scale(WORLD.s, WORLD.s);
  drawBackground();
  drawStove();
  drawPan();
  drawPlate();
  drawCurrentPancake();
  drawFX();
  drawGauge();
  ctx.restore();
  drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'countdown') { overlay(0.35); bigText(Math.ceil(countdown) || 'GO!', H / 2, 120, '#ffcc66'); }
  if (state === 'end') drawEnd();
}

// ---------- 루프 ----------
let last = performance.now();
newPancake();
function loop(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
